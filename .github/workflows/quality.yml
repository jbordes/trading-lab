name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          TRADINGLAB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRADINGLAB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  harness:
    name: Harness (${{ matrix.os }})
    needs: scope
    runs-on: ${{ matrix.os }}
    env:
      TRADINGLAB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      TRADINGLAB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run selected validation
        env:
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
        run: uv run python scripts/check.py ${{ env.VALIDATION_MODE }}

  quality:
    name: Quality gate
    if: ${{ always() }}
    needs: [scope, harness]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful classification and validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
        run: test "$SCOPE_RESULT" = success && test "$HARNESS_RESULT" = success
