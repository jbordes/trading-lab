name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TRADINGLAB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      TRADINGLAB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run full validation
        run: uv run python scripts/check.py full
