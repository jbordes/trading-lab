[project]
name = "tradinglab-harness"
version = "0.1.0"
description = "Portable development harness for TradingLab 2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tzdata==2026.5",
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5==5.0.6231; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.tradinglab.workflow]
stable-branch = "feature/remote-data-platform"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
